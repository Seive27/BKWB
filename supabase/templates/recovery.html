<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111827; line-height: 1.5;">
    <h2 style="color: #1E3A5F;">Reset your password</h2>
    <p>We received a request to reset the password for <strong>{{ .Email }}</strong>.</p>
    <p>Enter this code in the app to continue:</p>
    <p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; color: #1E3A5F;">{{ .Token }}</p>
    <p style="font-size: 14px; color: #6b7280;">This code expires shortly. If you didn't request a password reset, you can ignore this email.</p>
  </body>
</html>
