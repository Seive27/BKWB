project_id = "bkwb"

[functions.create-user]
verify_jwt = true

[functions.send-email]
# Internal-only helper, invoked edge-to-edge by create-user with the project
# secret key. The platform cannot JWT-verify requests made with the new secret
# keys, so verify_jwt is disabled here and the function authorizes callers
# itself (see supabase/functions/send-email/index.ts).
verify_jwt = false
