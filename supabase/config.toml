project_id = "bkwb"

# Password reset emails show a 6-digit OTP for in-app verification
# (verifyOtp type=recovery). Hosted projects must mirror this in
# Dashboard → Authentication → Email Templates → Reset password.
[auth.email.template.recovery]
subject = "Your BKWB password reset code"
content_path = "./supabase/templates/recovery.html"

[functions.create-user]
verify_jwt = true

[functions.resident-login]
# The function verifies the caller's JWT itself (auth.getUser + staff/super_admin
# role check server-side), so platform-level JWT validation is redundant. With
# verify_jwt on, the gateway's 401 can strip CORS headers and the staff app only
# sees "Failed to fetch".
verify_jwt = false

[functions.create-paymongo-checkout]
verify_jwt = true

[functions.resident-account-login]
# Pure authentication helper: it verifies the Account Number + password
# combination against GoTrue itself and must be callable by unauthenticated
# users (that's its whole purpose). No service data is exposed; failures are
# indistinguishable from a wrong password.
verify_jwt = false

[functions.send-email]
# Internal-only helper, invoked edge-to-edge by create-user with the project
# secret key. The platform cannot JWT-verify requests made with the new secret
# keys, so verify_jwt is disabled here and the function authorizes callers
# itself (see supabase/functions/send-email/index.ts).
verify_jwt = false

[functions.lunas-chat]
# Gateway JWT check on; function still re-validates auth.getUser and runs
# tools with the user-scoped client (RLS).
verify_jwt = true

[functions.lunas-embed]
# Staff JWT or service role; authorizes callers inside the function.
verify_jwt = true
